# Render Blueprint for the Queue App.
# Render reads this file to provision the service automatically.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: queue-app
    runtime: node
    plan: free
    # No dependencies to install (Node built-ins only), so build is a no-op.
    buildCommand: "echo no build needed"
    startCommand: "node src/server.js"
    # Render requires Node 22.5+ for the built-in node:sqlite module.
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      - key: NODE_ENV
        value: production
    # Render sets PORT automatically; the app already reads process.env.PORT.
    healthCheckPath: /
    autoDeploy: true
